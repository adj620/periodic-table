<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="28" fill="#facc15" filter="url(#glow)" />
  <!-- 오비탈 타원 3개 -->
  <ellipse cx="256" cy="256" rx="180" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="8" transform="rotate(0 256 256)" opacity="0.9" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="180" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="8" transform="rotate(60 256 256)" opacity="0.9" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="180" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="8" transform="rotate(120 256 256)" opacity="0.9" filter="url(#glow)" />
  <!-- 전자 구슬들 -->
  <circle cx="436" cy="256" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="166" cy="100" r="14" fill="#818cf8" filter="url(#glow)" />
  <circle cx="166" cy="412" r="14" fill="#c084fc" filter="url(#glow)" />
  <!-- 하단 원소 주기율표 심볼 텍스트 -->
  <text x="256" y="468" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="2">원소 주기율표</text>
</svg>
