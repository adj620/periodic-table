<!DOCTYPE html>
<html lang="ko">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Pretendard', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .download-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .app-icon {
      font-size: 3.5rem;
      margin-bottom: 0.75rem;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.35rem;
    }
    .app-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.45;
    }
    .meta-badges {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      margin-bottom: 0.75rem;
    }
    .btn-main:active {
      transform: scale(0.97);
    }
    .btn-sub {
      display: inline-block;
      color: #94a3b8;
      font-size: 0.8rem;
      text-decoration: underline;
      margin-bottom: 1.5rem;
    }
    .guide-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      text-align: left;
    }
    .guide-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .guide-steps {
      font-size: 0.8rem;
      color: #cbd5e1;
      padding-left: 1.2rem;
      line-height: 1.6;
    }
    .guide-steps strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="download-card">

    <div class="meta-badges">
      <span class="badge">Android APK</span>
      <span class="badge">용량: 4.2 MB</span>
      <span class="badge">v1.2.0</span>
    </div>

    <!-- APK 다이렉트 다운로드 버튼 (GitHub Releases 공식 무손실 직링크) -->
    <a href="https://github.com/adj620/periodic-table/releases/download/v1.2.0/periodic-table.apk" class="btn-main">
      <span>📥</span> <span>APK 앱 다운로드 (4.2MB)</span>
    </a>

    <div class="guide-box">
      <div class="guide-title">💡 스마트폰 설치 방법</div>
      <ol class="guide-steps">

        <li>다운로드가 완료되면 알림창의 <strong>파일을 터치</strong>합니다.</li>
        <li>'출처를 알 수 없는 앱 설치' 안내 시 <strong>[허용]</strong>을 누른 후 <strong>[설치]</strong>를 완료합니다.</li>
      </ol>
    </div>
  </div>
</body>
</html>
